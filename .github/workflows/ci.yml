name: Validate TinySift Core
# The app's release gate (scripts/release-policy.py in the app repository) reads only a green push run on main for the
# pinned commit, so a tag or branch push would repeat a check nothing reads. Branches are checked through their pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer commit supersedes a pull request's run. Runs on main are never cancelled: the app may pin any commit there.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The toolchain the app's CI and release build with, so a new stable Rust cannot fail an unchanged commit.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      # Clippy first: it fails in seconds, the tests take a minute.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
