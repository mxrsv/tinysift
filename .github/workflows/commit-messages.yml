name: Check commit messages
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            echo "No earlier commit to compare with; skipping."
            exit 0
          fi
          status=0
          for sha in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            .githooks/commit-msg "$RUNNER_TEMP/message" || { echo "  in commit $sha"; status=1; }
          done
          exit "$status"
      - name: Check pull request title and body
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pull-request"
          .githooks/commit-msg "$RUNNER_TEMP/pull-request"
