name: Command-line tool bug
description: The command-line tool did something wrong, failed or printed a wrong result.
title: "CLI: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For the Mac app, use the app form instead. If something was removed that the plan did not
        show, stop and [report it privately](https://github.com/mxrsv/tinysift/security/advisories/new).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and what it printed. Add `--dry-run` where the command has it. Remove any path you prefer not to share.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `--version`, or the commit you built from.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.5, MacBook Pro M3
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Homebrew
        - Downloaded from Releases
        - Built from source
    validations:
      required: true
