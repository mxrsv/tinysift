name: Feature idea
description: Something TinySift or its command-line tool should do and does not.
title: "Idea: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you are in, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options:
        - Mac app
        - Command-line tool
        - Both
    validations:
      required: true
