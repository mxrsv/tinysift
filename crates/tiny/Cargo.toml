[package]
name = "tinysift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tinysift"
path = "src/main.rs"

[dependencies]
tiny-core = { path = "../tiny-core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde_json = "1"
dialoguer = "0.12"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
crossterm = "0.29"
libc = "0.2"
unicode-segmentation = "1.13"
unicode-width = "0.2"
signal-hook = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
