[package]
name = "tiny"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tiny"
path = "src/main.rs"

[dependencies]
tiny-core = { path = "../tiny-core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde_json = "1"
dialoguer = "0.11"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
