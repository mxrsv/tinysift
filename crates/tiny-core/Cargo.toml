[package]
name = "tiny-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sampling must not queue behind Storage's work in Rayon's global pool.
sysinfo = { version = "0.32", default-features = false, features = ["component", "disk", "network", "system", "user"] }
libc = "0.2"
thiserror = "2"
rayon = "1.11"
matroska = "0.30"
mp4 = "0.14"

# Clean's moves to the Trash: NSFileManager's trashItemAtURL, so no Finder
# Automation permission is needed.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSError", "NSFileManager", "NSString", "NSURL", "NSValue"] }

[dev-dependencies]
bytes = "1"
tempfile = "3"
