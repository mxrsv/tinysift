[package]
name = "tiny-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sampling must not queue behind Storage's work in Rayon's global pool.
sysinfo = { version = "0.32", default-features = false, features = ["component", "disk", "network", "system", "user"] }
libc = "0.2"
thiserror = "2"
rayon = "1.11"

[dev-dependencies]
tempfile = "3"
